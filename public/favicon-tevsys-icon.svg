    <line x1="16" y1="16" x2="22" y2="5.6"/>
    <line x1="16" y1="16" x2="26.4" y2="10"/>
    <line x1="16" y1="16" x2="28" y2="16"/>
    <line x1="16" y1="16" x2="26.4" y2="22"/>
    <line x1="16" y1="16" x2="22" y2="26.4"/>
    <line x1="16" y1="16" x2="16" y2="28"/>
    <line x1="16" y1="16" x2="10" y2="26.4"/>
    <line x1="16" y1="16" x2="5.6" y2="22"/>
    <line x1="16" y1="16" x2="4" y2="16"/>
